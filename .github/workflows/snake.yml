name: Generate Contribution Animations

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Snake animation (reliable fallback)
      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: its-anuraj
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Pac-Man animation
      - name: Generate Pac-Man SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: its-anuraj
          outputs: |
            dist/pacman.svg?palette=github-light&color_dot={0:#1f2937,1:#22c55e,2:#16a34a,3:#15803d,4:#166534}&color_empty=#1f2937&color_skull=3B82F6
            dist/pacman-dark.svg?palette=github-dark&color_dot={0:#161b22,1:#0d4429,2:#006d32,3:#26a641,4:#39d353}&color_skull=3B82F6

      - name: Push to Output Branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
