  <text x="349" y="217" text-anchor="middle"
    font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="11" fill="#56d364">Node.js</text>

  <rect x="399" y="202" width="64" height="22" rx="3" fill="#161b22" stroke="#ED8B00" stroke-width="0.6"/>
  <text x="431" y="217" text-anchor="middle"
    font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="11" fill="#f0883e">Java</text>

  <!-- Decorative code snippet -->
  <text x="522" y="108"
    font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="13" fill="#7c3aed" fill-opacity="0.75">const anuraj = {</text>
  <text x="540" y="130"
    font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="13" fill="#8b949e" fill-opacity="0.6">  builds: <tspan fill="#79c0ff" fill-opacity="0.75">"mobile + web"</tspan>,</text>
  <text x="540" y="152"
    font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="13" fill="#8b949e" fill-opacity="0.6">  solves: <tspan fill="#79c0ff" fill-opacity="0.75">"real problems"</tspan>,</text>
  <text x="540" y="174"
    font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="13" fill="#8b949e" fill-opacity="0.6">  ships: <tspan fill="#56d364" fill-opacity="0.8">true</tspan></text>
  <text x="522" y="196"
    font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace"
    font-size="13" fill="#7c3aed" fill-opacity="0.75">};</text>

  <!-- Bottom accent line -->
  <rect x="0" y="278" width="900" height="2" fill="url(#accent)"/>
