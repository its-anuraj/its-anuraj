  <!-- Glow orbs -->
  <circle cx="830" cy="60"  r="90" fill="#7c3aed" fill-opacity="0.05"/>
  <circle cx="830" cy="220" r="70" fill="#0ea5e9" fill-opacity="0.05"/>

  <!-- Top accent line -->
