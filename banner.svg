    <circle cx="510" cy="220" r="1.2"/><circle cx="540" cy="220" r="1.2"/><circle cx="570" cy="220" r="1.2"/><circle cx="600" cy="220" r="1.2"/><circle cx="630" cy="220" r="1.2"/><circle cx="660" cy="220" r="1.2"/><circle cx="690" cy="220" r="1.2"/><circle cx="720" cy="220" r="1.2"/><circle cx="750" cy="220" r="1.2"/><circle cx="780" cy="220" r="1.2"/><circle cx="810" cy="220" r="1.2"/><circle cx="840" cy="220" r="1.2"/><circle cx="870" cy="220" r="1.2"/>
